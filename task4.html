<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 4</title>
    <style>
        table {
            border-collapse: collapse;
            margin-bottom: 25px;
            width: 350px;
        }
        td {
            border: 1px solid black;
            padding: 6px 10px;
            text-align: left;
            vertical-align: middle;
        }
        /* Центрування вмісту для об'єднаних бічних комірок у третій таблиці */
        .center-cell {
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Перша таблиця -->
    <table>
        <tr>
            <td colspan="2">комірка 1</td>
            <td>комірка 3</td>
        </tr>
        <tr>
            <td rowspan="2">комірка 4</td>
            <td>комірка 5</td>
            <td>комірка 6</td>
        </tr>
        <tr>
            <td>комірка 8</td>
            <td>комірка 9</td>
        </tr>
    </table>

    <!-- Друга таблиця -->
    <table>
        <tr>
            <td colspan="3">комірка 1</td>
        </tr>
        <tr>
            <td>комірка 4</td>
            <td rowspan="2">комірка 5</td>
            <td>комірка 6</td>
        </tr>
        <tr>
            <td>комірка 8</td>
            <td>комірка 9</td>
        </tr>
    </table>

    <!-- Третя таблиця -->
    <table>
        <tr>
            <td rowspan="3" class="center-cell">комірка 1</td>
            <td>комірка 2</td>
            <td rowspan="3" class="center-cell">комірка 3</td>
        </tr>
        <tr>
            <td>комірка 5</td>
        </tr>
        <tr>
            <td>комірка 88</td>
        </tr>
    </table>

</body>
</html>
